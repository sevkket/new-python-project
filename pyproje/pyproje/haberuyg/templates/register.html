{% extends "base.html" %}

{% block content %}

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<div class="modern-auth-container fade-in">
    <div class="modern-auth-card">
        
        <div class="modern-auth-header">
            <h2>Yeni Hesap Oluştur</h2>
            <p>Kayıt işlemlerini tamamlayarak kendi haber listenizi oluşturmaya başlayın.</p>
        </div>

        <form method="POST" class="modern-form">
            
            <div class="modern-field-group">
                <input 
                    type="text" 
                    id="username"
                    name="username" 
                    placeholder="Kullanıcı Adı" 
                    required
                    autocomplete="off"
                >
            </div>

            <div class="modern-field-group password-wrapper">
                <input 
                    id="registerPassword" 
                    type="password" 
                    name="password" 
                    placeholder="Şifre" 
                    required
                >
                <button 
                    type="button" 
                    class="modern-toggle-btn" 
                    onclick="togglePasswordVisibility('registerPassword', this)" 
                    aria-label="Şifreyi göster"
                >
                    <i class="fa-regular fa-eye eye-main-icon"></i>
                </button>
            </div>

            <button type="submit" class="btn-modern-primary">
                Kayıt İşlemini Tamamla
            </button>

            <div class="modern-auth-footer">
                <span>Zaten üye misiniz? <a href="/login">Giriş Yapın</a></span>
            </div>

        </form>
    </div>
</div>

<style>
    /* Ortak sınıfları ezmemek ve login ile aynı temiz havayı yakalamak için CSS düzeni */
    .modern-auth-container { display: flex; align-items: center; justify-content: center; min-height: 70vh; padding: 40px 20px; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    .modern-auth-card { background: var(--m-card, #ffffff); border: 1px solid var(--m-border, #e2e8f0); width: 100%; max-width: 380px; padding: 45px 40px; border-radius: 12px; box-shadow: 0 4px 30px rgba(0, 0, 0, 0.02); }
    .modern-auth-header { margin-bottom: 35px; }
    .modern-auth-header h2 { font-size: 24px; font-weight: 700; color: var(--m-text, #0b0f19); letter-spacing: -0.5px; margin: 0 0 10px 0; }
    .modern-auth-header p { font-size: 13.5px; color: var(--m-muted, #64748b); line-height: 1.5; margin: 0; }
    .modern-form { display: flex; flex-direction: column; gap: 16px; }
    .modern-field-group { position: relative; }
    .modern-field-group input { width: 100%; padding: 14px 16px; border: 1px solid var(--m-border, #e2e8f0); border-radius: 8px; background: transparent; color: var(--m-text, #0b0f19); font-size: 14px; outline: none; box-sizing: border-box; transition: border-color 0.2s; }
    .modern-field-group input:focus { border-color: var(--m-text, #0b0f19); }
    .password-wrapper input { padding-right: 46px; }
    .modern-toggle-btn { position: absolute; right: 14px; top: 50%; transform: translateY(-50%); background: transparent; border: none; color: var(--m-muted, #64748b); cursor: pointer; padding: 4px; font-size: 15px; }
    .modern-toggle-btn.password-visible .eye-main-icon::before { content: "\f070"; }
    .btn-modern-primary { background: var(--m-text, #0b0f19); color: var(--m-card, #ffffff) !important; border: none; padding: 14px; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; transition: opacity 0.2s; margin-top: 10px; }
    .btn-modern-primary:hover { opacity: 0.9; }
    .modern-auth-footer { text-align: center; font-size: 13px; color: var(--m-muted, #64748b); margin-top: 20px; }
    .modern-auth-footer a { color: var(--m-text, #0b0f19) !important; text-decoration: none; font-weight: 600; }
    .modern-auth-footer a:hover { text-decoration: underline; }
    .fade-in { animation: fadeIn 0.3s ease-out; }
</style>

{% endblock %}
